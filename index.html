<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asteroids</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="cabinet">
    <canvas id="game" tabindex="0"></canvas>
    <div id="overlay">
      <p id="title">ASTEROIDS</p>
      <p class="hint">A D rotate &nbsp; W thrust &nbsp; SPACE fire &nbsp; H hyperspace</p>
      <p class="hint">P pause &nbsp; M mute</p>
      <p class="hint">Press any key to start</p>
    </div>
    <div id="touch" aria-hidden="true">
      <div class="touch-left">
        <button class="tbtn" data-key="a" type="button">⟲</button>
        <button class="tbtn" data-key="d" type="button">⟳</button>
      </div>
      <div class="touch-right">
        <button class="tbtn" data-key="h" type="button">HYP</button>
        <button class="tbtn" data-key="w" type="button">▲</button>
        <button class="tbtn" data-key=" " type="button">FIRE</button>
      </div>
    </div>
  </div>
  <script src="sounds.js"></script>
  <script src="game.js"></script>
</body>
</html>
